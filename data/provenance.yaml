# 파일별 출처 레지스트리 — scripts/provenance.py가 SHA256을 붙여 DATA_PROVENANCE.md 생성.
# pattern은 data/raw/ 기준 glob. 모든 raw 파일은 정확히 하나의 패턴에 매칭돼야 한다 (아니면 ingest 실패).
# license: 명시 없으면 "research use" 관행 표기. 출처 불명은 source: UNKNOWN.

registry:
  - pattern: "assets/assets_blast_furnace.csv"
    contents: "한·일 5사 11개 고로 레지스트리 (용량, reline 연도, 배출강도)"
    source: "POSCO/Hyundai DART, Nippon/JFE/Kobe EDINET FY2024, CDP, ACCR (일부 PROVISIONAL — 파일 내 notes)"
    collected: "2026-06-29"
    units: "Mt/yr, tCO2/t"
    license: "public disclosures, research use"

  - pattern: "financials/company_financials.csv"
    contents: "기업 재무 (매출·영업이익·이자부부채·자본·이자)"
    source: "DART 연결재무제표 (005490, 004020)"
    collected: "2026-06-30"
    units: "KRW tn"
    license: "DART open data"

  - pattern: "production/company_production.csv"
    contents: "기업별 조강 생산량 2021–2024"
    source: "worldsteel 2024; company annual reports"
    collected: "2026-06-29"
    units: "Mt crude steel"
    license: "worldsteel published figures, research use"

  - pattern: "opex_energy/intensity_coefficients.csv"
    contents: "기술 route별 투입 원단위 (H2 kg/t, 전력 MWh/t, 배출강도 등)"
    source: "SPARK CostEngine; Midrex Tech Sheet 2023; LBL Green Steel; IEA; Nature Rev Energy 2024"
    collected: "2026-06-29"
    units: "per t_steel"
    license: "literature values, research use"

  - pattern: "opex_energy/price_parameters.csv"
    contents: "가격 파라미터 (H2, 전력 KR/JP, 석탄, 철광석, 탄소, σ·μ 밴드)"
    source: "IMARC H2 Index; Intratec 2025; World Bank Pink Sheet 2026; ICAP 2025"
    collected: "2026-06-29"
    units: "USD (파일 내 unit 컬럼)"
    license: "literature values, research use"

  - pattern: "capex_refs/capex_h2dri_references.csv"
    contents: "H2-DRI CAPEX 참조 (K01–K12, 학습률)"
    source: "DIW DP2082 Huettel & Lehner 2024; IRENA 2023; LBL; ACCR; S&P Global"
    collected: "2026-06-30"
    units: "USD/t_cap"
    license: "literature values, research use"

  - pattern: "dart/[0-9]*_20[0-9][0-9].json"
    contents: "DART 사업보고서 재무 원본 JSON (종목코드_회계연도)"
    source: "금융감독원 DART OpenAPI"
    collected: "2026-07-04"
    units: "KRW"
    license: "DART open data"

  - pattern: "dart/dart_portfolio*.csv"
    contents: "DART 포트폴리오 집계 (WACC 산출 입력)"
    source: "DART OpenAPI 집계 (기존 repo 스크립트 산출)"
    collected: "2026-07-04"
    units: "KRW tn, %"
    license: "DART open data (derived)"

  - pattern: "dart/dart_portfolio.json"
    contents: "DART 포트폴리오 집계 JSON"
    source: "DART OpenAPI 집계 (기존 repo 스크립트 산출)"
    collected: "2026-07-04"
    units: "KRW tn, %"
    license: "DART open data (derived)"

  - pattern: "research/params_consolidated_*.csv"
    contents: "consolidated parameter research (weekly SSOT snapshots from the knowledge base)"
    source: "planit_internal — PLANiT Institute internal analysis; workbook CAP_DS_params (raw/clean/export)"
    collected: "2026-07-29"
    units: "mixed — unit column per row"
    license: "internal analysis, research use"

  - pattern: "intensities/intensities_*.csv"
    contents: "candidate input intensities per route with explicit process boundary"
    source: "planit_internal — CAP_DS_intensities export"
    collected: "filename date"
    units: "kg/t, MWh/t, tCO2/t (row unit column)"
    license: "internal analysis, research use"

  - pattern: "research/SPARK_cost_inputs_2026-07-01.csv"
    contents: "SPARK 비용 입력 (기술 비용 구성요소)"
    source: "SPARK CostEngine 프로젝트 내부 정리"
    collected: "2026-07-01"
    units: "USD"
    license: "internal research compilation"

  - pattern: "research/CAP_instruments_2026-07-03.csv"
    contents: "계약·정책 수단 목록 (CfD, PPA, 보조금 — s06 waterfall 입력)"
    source: "공시·보도 기반 내부 정리 (JOGMEC, CHPS, K-ETS 등)"
    collected: "2026-07-03"
    units: "mixed (파일 내 명시)"
    license: "internal research compilation"

  - pattern: "research/CAP_state_variables_2026-07-02.csv"
    contents: "상태변수 정의·캘리브레이션 노트"
    source: "내부 정리 (문헌 앵커 파일 내 명시)"
    collected: "2026-07-02"
    units: "mixed"
    license: "internal research compilation"

  - pattern: "reference/CAP_CostEngine_DataMap.xlsx"
    contents: "비용엔진 데이터맵 워크북"
    source: "내부 정리 (SPARK 파생)"
    collected: "2026-07-01"
    units: "mixed"
    license: "internal research compilation"

  - pattern: "reference/CAP_Literature_References.xlsx"
    contents: "문헌 참조 목록"
    source: "내부 정리"
    collected: "2026-07-01"
    units: "n/a"
    license: "internal research compilation"

  - pattern: "reference/CAP_Company_Data.xlsx"
    contents: "기업 데이터 워크북 (EV, 재무 보조)"
    source: "DART/EDINET/시장데이터 내부 정리"
    collected: "2026-07-01"
    units: "mixed"
    license: "internal research compilation"

  - pattern: "reference/CAP_Technology_MACC_Analysis.xlsx"
    contents: "철강 기술 MACC 분석 워크북"
    source: "내부 정리 (MACC 문헌 종합)"
    collected: "2026-07-01"
    units: "USD/tCO2, MtCO2"
    license: "internal research compilation"

  - pattern: "legacy_config/model_parameters.yaml"
    contents: "구 리포 마스터 파라미터 (v2026-06-29) — 신 config의 출처 감사용 보존"
    source: "기존 CAP_local repo"
    collected: "2026-07-22"
    units: "mixed"
    license: "internal"

  - pattern: "legacy_config/CAP_model_params_consolidated_2026-07-05.csv"
    contents: "구 리포 파라미터 통합표 — 감사용 보존"
    source: "기존 CAP_local repo"
    collected: "2026-07-22"
    units: "mixed"
    license: "internal"

  - pattern: "*/MISSING.md"
    contents: "미확보 데이터 명세 (KAU/SMP/JEPX/GCAM)"
    source: "본 리포 작성 (2026-07-22 자동수집 시도 실패 기록)"
    collected: "2026-07-22"
    units: "n/a"
    license: "internal"

  - pattern: "kau/icap_systems_*.json"
    contents: "ICAP Allowance Price Explorer 전체 덤프 — KEA(id 8) secondary 시장 KAU 일별 [USD, EUR, KRW] 2015-01-12~"
    source: "allowancepriceexplorer.icapcarbonaction.com /api/systems (ICAP)"
    collected: "2026-07-22"
    units: "USD·EUR·KRW /tCO2"
    license: "ICAP published data, research use"

  # 신규 수집 파일이 도착하면 아래 패턴이 잡는다 (MISSING.md의 ingest 계약과 짝)
  - pattern: "kau/krx_kau_daily_*.csv"
    contents: "KAU 일별 시세 (KRX 배출권시장)"
    source: "KRX data.krx.co.kr MDCSTAT15801 수동 다운로드"
    collected: "파일명 날짜"
    units: "KRW/tCO2"
    license: "KRX market data, research use"

  - pattern: "smp/smp_daily_*.csv"
    contents: "육지 SMP 일별"
    source: "KPX EPSIS 수동 다운로드"
    collected: "파일명 날짜"
    units: "KRW/kWh"
    license: "KPX open data"

  - pattern: "jepx/spot_summary_*.csv"
    contents: "JEPX 스팟 시스템프라이스"
    source: "jepx.jp 수동 다운로드"
    collected: "파일명 날짜"
    units: "JPY/kWh"
    license: "JEPX published data"
